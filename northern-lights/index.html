<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Northern Lights p5.js Sketch</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
    <script src="./sketch.js" defer></script>
  </head>
  <body>
    <main id="sketch-holder" aria-label="Animated northern lights over a dark tree line"></main>
    <div class="hud" aria-label="Sketch controls">
      <button id="pauseBtn" type="button" aria-label="Pause animation" title="Pause animation">
        <span id="pauseIcon">||</span>
      </button>
      <label title="Aurora strength">
        <span>Aurora</span>
        <input id="intensity" type="range" min="0.55" max="1.6" value="1.05" step="0.01" />
      </label>
      <label title="Shooting star frequency">
        <span>Meteors</span>
        <input id="meteorRate" type="range" min="0.15" max="2.5" value="1" step="0.01" />
      </label>
    </div>
  </body>
</html>
